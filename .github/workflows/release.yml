name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: TrackTile
    env:
      # Optional. Without these the app is ad-hoc signed and not notarized.
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Store notarization credentials
        if: env.DEVELOPER_ID_P12 != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool store-credentials tracktile \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=tracktile" >> "$GITHUB_ENV"

      - name: Build release
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" \
            "build/TrackTile-$version.zip" "build/TrackTile-$version.zip.sha256" \
            --title "TrackTile $version" \
            --generate-notes \
            --target "$GITHUB_SHA"
